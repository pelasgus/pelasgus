name: Update profile desk

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-desk
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Refresh recent work
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix develop --command nu scripts/update-profile.nu

      - name: Commit changes
        run: |
          if git diff --quiet -- assets/typing.svg assets/typing.template.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/typing.svg assets/typing.template.svg
          git commit --no-gpg-sign -m "chore: refresh profile desk"
          git push
