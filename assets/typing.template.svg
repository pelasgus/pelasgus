<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">D.A.Pelasgus</title>
  <desc id="desc">An animated editorial masthead introducing D.A.Pelasgus as a Technocrat.</desc>
  <style>
    @font-face {
      font-family: "Operator Mono Embedded";
      src: url("data:font/otf;base64,__FONT_DATA__") format("opentype");
      font-style: normal;
      font-weight: 300;
    }
    @font-face {
      font-family: "Operator Mono Embedded";
      src: url("data:font/otf;base64,__FONT_ITALIC_DATA__") format("opentype");
      font-style: italic;
      font-weight: 300;
    }

    :root { color-scheme: light dark; }
    .paper { fill: #f4f0e8; }
    .ink { fill: #17151a; }
    .muted { fill: #625d68; }
    .rule { stroke: #17151a; }
    .accent { fill: #663399; }
    .display { font-family: "Operator Mono Embedded", monospace; font-weight: 300; }
    .label { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 3px; }
    .name { font-size: 80px; letter-spacing: -4px; }
    .line { font-size: 27px; font-style: italic; letter-spacing: -.5px; }
    .trust { font-size: 17px; letter-spacing: .5px; }
    .language { font-size: 14px; letter-spacing: .25px; }
    .bar-bg { fill: #17151a; opacity: .12; }
    .bar {
      fill: #663399;
      transform-box: fill-box;
      transform-origin: left center;
      animation: bar-grow 1.15s cubic-bezier(.22, 1, .36, 1) both;
    }
    .bar-1 { animation-delay: 120ms; }
    .bar-2 { animation-delay: 240ms; }
    .bar-3 { animation-delay: 360ms; }
    .bar-4 { animation-delay: 480ms; }
    .bar-5 { animation-delay: 600ms; }
    .folio { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; }

    .phrase { opacity: 0; }
    .p1 { opacity: 1; animation: phrase1 16s infinite; }
    .p2 { animation: phrase2 16s infinite; }
    .p3 { animation: phrase3 16s infinite; }
    .p4 { animation: phrase4 16s infinite; }
    .wipe1 { animation: type1 16s steps(10, end) infinite; }
    .wipe2 { animation: type2 16s steps(35, end) infinite; }
    .wipe3 { animation: type3 16s steps(31, end) infinite; }
    .wipe4 { animation: type4 16s steps(33, end) infinite; }
    .cursor { animation: cursor 800ms steps(1, end) infinite; }
    .credential { opacity: 0; }
    .gpg { opacity: 1; animation: credential1 10s infinite; }
    .ssh { animation: credential2 10s infinite; }

    @keyframes phrase1 { 0%, 23% { opacity: 1 } 25%, 100% { opacity: 0 } }
    @keyframes phrase2 { 0%, 24% { opacity: 0 } 25%, 48% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes phrase3 { 0%, 49% { opacity: 0 } 50%, 73% { opacity: 1 } 75%, 100% { opacity: 0 } }
    @keyframes phrase4 { 0%, 74% { opacity: 0 } 75%, 98% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes type1 { 0% { width: 0 } 15%, 100% { width: 760px } }
    @keyframes type2 { 0%, 25% { width: 0 } 40%, 100% { width: 760px } }
    @keyframes type3 { 0%, 50% { width: 0 } 65%, 100% { width: 760px } }
    @keyframes type4 { 0%, 75% { width: 0 } 90%, 100% { width: 760px } }
    @keyframes cursor { 0%, 48% { opacity: 1 } 49%, 100% { opacity: 0 } }
    @keyframes bar-grow {
      from { transform: scaleX(0); opacity: .35; }
      to { transform: scaleX(1); opacity: 1; }
    }
    @keyframes credential1 {
      0% { opacity: 0; transform: translateY(12px) }
      8%, 42% { opacity: 1; transform: translateY(0) }
      50%, 100% { opacity: 0; transform: translateY(-12px) }
    }
    @keyframes credential2 {
      0%, 50% { opacity: 0; transform: translateY(12px) }
      58%, 92% { opacity: 1; transform: translateY(0) }
      100% { opacity: 0; transform: translateY(-12px) }
    }

    @media (prefers-color-scheme: dark) {
      .paper { fill: #17151a; }
      .ink { fill: #f4f0e8; }
      .muted { fill: #aaa2b1; }
      .rule { stroke: #f4f0e8; }
      .accent { fill: #b48bdd; }
      .bar-bg { fill: #f4f0e8; opacity: .16; }
      .bar { fill: #b48bdd; }
    }

    @media (prefers-reduced-motion: reduce) {
      .phrase, .p1 { animation: none; opacity: 0; }
      .p1 { opacity: 1; }
      .wipe1 { animation: none; width: 760px; }
      .cursor { animation: none; opacity: 1; }
      .credential, .gpg { animation: none; opacity: 0; }
      .gpg { opacity: 1; }
      .bar { animation: none; transform: scaleX(1); opacity: 1; }
    }
  </style>

  <defs>
    <clipPath id="clip1"><rect class="wipe1" x="84" y="218" width="760" height="48" /></clipPath>
    <clipPath id="clip2"><rect class="wipe2" x="84" y="218" width="0" height="48" /></clipPath>
