      <stop offset="0" stop-color="white" />
      <stop offset=".86" stop-color="white" />
      <stop offset="1" stop-color="black" />
    </linearGradient>
    <mask id="rail-mask" maskUnits="objectBoundingBox" maskContentUnits="objectBoundingBox">
      <rect width="1" height="1" fill="url(#rail-fade)" />
    </mask>
  </defs>

